version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: thesis-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - thesis-net
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 3

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: thesis-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 2
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      # Performance tuning for high throughput
      KAFKA_NUM_NETWORK_THREADS: 8
      KAFKA_NUM_IO_THREADS: 8
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 102400
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 102400
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 104857600
    networks:
      - thesis-net
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s
    volumes:
      - kafka-data:/var/lib/kafka/data

  redis:
    image: redis:7.2-alpine
    container_name: thesis-redis
    ports:
      - "6379:6379"
    networks:
      - thesis-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  # Optional: Topic initialization service (pre-creates topics)
  kafka-setup:
    image: confluentinc/cp-kafka:7.5.0
    container_name: thesis-kafka-setup
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - thesis-net
    command: >
      bash -c "
        echo 'Waiting for Kafka to be ready...';
        sleep 10;
        echo 'Creating topics...';
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic raw-ticks --partitions 4 --replication-factor 1 --config retention.ms=7200000;
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic normalized-vectors --partitions 4 --replication-factor 1 --config retention.ms=7200000;
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic health-events --partitions 1 --replication-factor 1 --config retention.ms=7200000;
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic anomaly-scores --partitions 4 --replication-factor 1 --config retention.ms=7200000;
        echo 'Topics created successfully';
        kafka-topics --list --bootstrap-server kafka:29092;
      "
    restart: "no"

networks:
  thesis-net:
    driver: bridge
    name: thesis-network

volumes:
  kafka-data:
    name: thesis-kafka-data
  redis-data:
    name: thesis-redis-data
